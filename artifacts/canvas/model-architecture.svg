<svg xmlns="http://www.w3.org/2000/svg" width="780" height="990" viewBox="0 0 780 990" role="img" aria-label="Figure 1: PubMedBERT + DoRA case-report classifier architecture">
  <rect width="780" height="990" fill="#ffffff"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#111111">

    <text x="740" y="26" font-size="8.5" text-anchor="end" fill="#555555">encoder &#183; PubMedBERT (BiomedBERT, abstract + full text)</text>

    <!-- output -->
    <rect x="320" y="40" width="140" height="34" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
    <text x="390" y="62" font-size="12" text-anchor="middle"><tspan font-style="italic">p</tspan>(case)</text>
    <line x1="462" y1="61" x2="474" y2="61" stroke="#999999" stroke-width="0.8"/>
    <text x="476" y="46" font-size="8.5" fill="#555555">decision</text>
    <text x="476" y="61" font-size="9"><tspan font-style="italic">p</tspan> &#8805; 0.3962 &#8594; case <tspan fill="#555555">(F1-optimal)</tspan></text>
    <text x="476" y="75" font-size="9"><tspan font-style="italic">p</tspan> &#8805; 0.3502 &#8594; case <tspan fill="#555555">(precision &#8805; 0.90)</tspan></text>
    <text x="476" y="89" font-size="9" fill="#555555">otherwise &#8594; non-case</text>

    <!-- softmax -->
    <rect x="320" y="112" width="140" height="34" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
    <text x="390" y="134" font-size="11" text-anchor="middle">softmax</text>

    <!-- linear head -->
    <rect x="290" y="184" width="200" height="42" fill="#f7f7f7" stroke="#111111" stroke-width="1.2"/>
    <text x="390" y="202" font-size="11" text-anchor="middle">Linear (1536 &#8594; 2)</text>
    <text x="390" y="217" font-size="8" text-anchor="middle" fill="#666666">3,074 trainable</text>

    <!-- concat -->
    <rect x="260" y="264" width="260" height="40" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
    <text x="390" y="288" font-size="10.5" text-anchor="middle">concatenate &#8594; 1536-d</text>

    <!-- pooling -->
    <rect x="110" y="340" width="220" height="54" fill="#f2f2f2" stroke="#111111" stroke-width="1.2"/>
    <text x="220" y="361" font-size="10" text-anchor="middle">L2(mean over all <tspan font-style="italic">n</tspan> chunks)</text>
    <text x="220" y="377" font-size="9" text-anchor="middle" fill="#555555">768-d</text>

    <rect x="450" y="340" width="220" height="54" fill="#f2f2f2" stroke="#111111" stroke-width="1.2"/>
    <text x="560" y="361" font-size="10" text-anchor="middle">L2(mean over the first 2)</text>
    <text x="560" y="377" font-size="9" text-anchor="middle" fill="#555555">768-d</text>

    <!-- chunk vectors -->
    <rect x="210" y="430" width="360" height="46" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
    <text x="390" y="450" font-size="10.5" text-anchor="middle">chunk vectors: <tspan font-style="italic">n</tspan> &#215; 768</text>
    <text x="390" y="465" font-size="9" text-anchor="middle" fill="#555555">masked mean over tokens, per chunk</text>

    <!-- encoder container -->
    <rect x="180" y="510" width="420" height="250" fill="#fafafa" stroke="#111111" stroke-width="1.2"/>
    <text x="390" y="534" font-size="11.5" text-anchor="middle" font-weight="bold">PubMedBERT encoder</text>
    <text x="390" y="550" font-size="9" text-anchor="middle" fill="#555555">12 layers &#183; 110M parameters &#183; frozen</text>

    <!-- transformer layer -->
    <rect x="250" y="566" width="280" height="26" fill="#ececec" stroke="#111111" stroke-width="1"/>
    <text x="390" y="584" font-size="9.5" text-anchor="middle">Add &amp; Norm</text>

    <rect x="250" y="602" width="280" height="30" fill="#dfe9f3" stroke="#111111" stroke-width="1"/>
    <text x="390" y="622" font-size="9.5" text-anchor="middle">Feed-Forward (GELU)</text>

    <rect x="250" y="642" width="280" height="26" fill="#ececec" stroke="#111111" stroke-width="1"/>
    <text x="390" y="660" font-size="9.5" text-anchor="middle">Add &amp; Norm</text>

    <rect x="250" y="678" width="280" height="30" fill="#f6e3d3" stroke="#111111" stroke-width="1"/>
    <text x="390" y="698" font-size="9.5" text-anchor="middle">Multi-Head Self-Attention</text>

    <rect x="250" y="720" width="280" height="24" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
    <text x="390" y="736" font-size="9" text-anchor="middle" fill="#333333">token + position embeddings</text>

    <!-- repeated-layer bracket -->
    <path d="M 536 566 L 546 566 L 546 708 L 536 708" fill="none" stroke="#555555" stroke-width="1"/>
    <text x="552" y="641" font-size="9" fill="#555555">&#215; 12</text>

    <!-- DoRA bracket -->
    <path d="M 606 670 L 612 670 L 612 716 L 606 716" fill="none" stroke="#555555" stroke-width="0.9"/>
    <text x="622" y="680" font-size="9" font-weight="bold" fill="#333333">DoRA, every layer</text>
    <text x="622" y="694" font-size="9" fill="#555555">r = 16, &#945; = 32</text>
    <text x="622" y="708" font-size="9" fill="#555555">query, value</text>
    <text x="622" y="722" font-size="9" fill="#555555">608,256 trainable</text>

    <!-- tokenize -->
    <rect x="200" y="796" width="380" height="48" fill="#f5f5f5" stroke="#111111" stroke-width="1.2"/>
    <text x="390" y="817" font-size="10.5" text-anchor="middle">tokenize &#183; 480-token chunks</text>
    <text x="390" y="833" font-size="9" text-anchor="middle" fill="#555555"><tspan font-style="italic">n</tspan> &#8804; 12 &#183; first 2 kept, remainder evenly spaced</text>

    <!-- input -->
    <rect x="210" y="870" width="360" height="44" fill="#f5f5f5" stroke="#111111" stroke-width="1.2"/>
    <text x="390" y="890" font-size="10.5" text-anchor="middle">title &#183; abstract &#183; full text</text>
    <text x="390" y="905" font-size="9" text-anchor="middle" fill="#555555">PDF &#8594; extracted text, if provided</text>

    <!-- arrows -->
    <g stroke="#111111" stroke-width="1.1" fill="#111111">
      <line x1="390" y1="112" x2="390" y2="79"/><polygon points="390,74 386.5,81 393.5,81"/>
      <line x1="390" y1="184" x2="390" y2="151"/><polygon points="390,146 386.5,153 393.5,153"/>
      <line x1="390" y1="264" x2="390" y2="239"/><polygon points="390,234 386.5,241 393.5,241"/>

      <!-- pools -> concat -->
      <line x1="220" y1="340" x2="220" y2="330"/><line x1="560" y1="340" x2="560" y2="330"/>
      <line x1="220" y1="330" x2="560" y2="330"/>
      <line x1="390" y1="330" x2="390" y2="309"/><polygon points="390,304 386.5,311 393.5,311"/>

      <!-- chunk vectors -> pools -->
      <line x1="390" y1="430" x2="390" y2="414"/><line x1="220" y1="414" x2="560" y2="414"/>
      <line x1="220" y1="414" x2="220" y2="399"/><polygon points="220,394 216.5,401 223.5,401"/>
      <line x1="560" y1="414" x2="560" y2="399"/><polygon points="560,394 556.5,401 563.5,401"/>

      <!-- encoder -> chunk vectors -->
      <line x1="390" y1="510" x2="390" y2="481"/><polygon points="390,476 386.5,483 393.5,483"/>

      <!-- tokenize -> embeddings (crosses container border) -->
      <line x1="390" y1="796" x2="390" y2="749"/><polygon points="390,744 386.5,751 393.5,751"/>

      <!-- input -> tokenize -->
      <line x1="390" y1="870" x2="390" y2="849"/><polygon points="390,844 386.5,851 393.5,851"/>

      <!-- encoder internal -->
      <line x1="390" y1="720" x2="390" y2="713"/><polygon points="390,708 386.5,715 393.5,715"/>
      <line x1="390" y1="678" x2="390" y2="673"/><polygon points="390,668 386.5,675 393.5,675"/>
      <line x1="390" y1="642" x2="390" y2="637"/><polygon points="390,632 386.5,639 393.5,639"/>
      <line x1="390" y1="602" x2="390" y2="597"/><polygon points="390,592 386.5,599 393.5,599"/>

      <!-- residual: self-attention -->
      <polyline points="390,714 222,714 222,655 244,655" fill="none"/>
      <polygon points="250,655 243,651.5 243,658.5"/>

      <!-- residual: feed-forward -->
      <polyline points="390,637 230,637 230,579 244,579" fill="none"/>
      <polygon points="250,579 243,575.5 243,582.5"/>
    </g>

    <!-- caption -->
    <line x1="40" y1="938" x2="740" y2="938" stroke="#cccccc" stroke-width="0.8"/>
    <text x="40" y="956" font-size="9" fill="#333333"><tspan font-weight="bold">Figure 1:</tspan> PubMedBERT + DoRA case-report classifier. Encoder frozen; 611,330 trainable parameters (0.56%) = 608,256 DoRA + 3,074 head.</text>
    <text x="40" y="972" font-size="9" fill="#333333">Titles naming a case report / case series (or report/series of <tspan font-style="italic">N</tspan> &lt; 100 cases) force a case label in the corpus pipeline, outside this model.</text>
  </g>
</svg>
